<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk — Inventory &amp; Cashflow Manager</title>
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="auth-page">
  <a class="skip-link" href="#main">Lewati ke konten</a>
  <main id="main" class="auth-card">
    <header class="auth-card__header">
      <h1 class="auth-card__title">Masuk</h1>
      <p class="text-muted">Inventory &amp; Cashflow Manager</p>
    </header>
    <div id="form-message" class="alert" hidden></div>
    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--primary btn--block" id="submit-btn" type="submit">Masuk</button>
    </form>
    <p class="auth-card__footer">Belum punya akun? <a href="register.html">Daftar</a></p>
  </main>
  <script type="module" src="assets/js/login.js"></script>
</body>
</html>
