<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arus Kas — Inventory &amp; Cashflow Manager</title>
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke konten</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main">
      <header class="topbar">
        <button class="btn btn--secondary btn--sm menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false">Menu</button>
        <strong id="business-name"></strong>
      </header>
      <main class="content" id="main">
        <header class="page-header"><h1>Arus Kas</h1></header>
        <div id="page-message" class="alert" hidden></div>
        <section class="card" aria-labelledby="filter-title">
          <h2 class="card__title" id="filter-title">Filter</h2>
          <form id="filter-form">
            <div class="form-row">
              <div class="form-group"><label class="form-label" for="f-from">Dari tanggal</label><input class="form-input" id="f-from" name="from" type="date"></div>
              <div class="form-group"><label class="form-label" for="f-to">Sampai tanggal</label><input class="form-input" id="f-to" name="to" type="date"></div>
              <div class="form-group"><label class="form-label" for="f-category">Kategori</label><select class="form-select" id="f-category" name="category"><option value="">Semua kategori</option></select></div>
              <div class="form-group"><label class="form-label" for="f-direction">Jenis</label>
                <select class="form-select" id="f-direction" name="direction"><option value="">Masuk dan keluar</option><option value="in">Hanya masuk</option><option value="out">Hanya keluar</option></select></div>
            </div>
            <div class="form-actions">
              <button class="btn btn--secondary" id="reset-btn" type="button">Bulan ini</button>
              <button class="btn btn--primary" id="apply-btn" type="submit">Terapkan</button>
            </div>
          </form>
        </section>
        <section class="grid-cards cashflow-summary" aria-label="Ringkasan periode">
          <article class="card stat-card"><h2 class="stat-card__label">Pemasukan periode</h2><p class="stat-card__value text-income" id="stat-in">…</p></article>
          <article class="card stat-card"><h2 class="stat-card__label">Pengeluaran periode</h2><p class="stat-card__value text-expense" id="stat-out">…</p></article>
          <article class="card stat-card"><h2 class="stat-card__label">Saldo periode</h2><p class="stat-card__value" id="stat-period">…</p></article>
          <article class="card stat-card"><h2 class="stat-card__label">Saldo kas saat ini</h2><p class="stat-card__value" id="stat-balance">…</p></article>
        </section>
        <p class="form-hint">Ringkasan mengikuti rentang tanggal (semua kategori). Filter kategori dan jenis hanya memengaruhi tabel.</p>
        <section class="card" aria-labelledby="list-title">
          <h2 class="card__title" id="list-title">Riwayat kas</h2>
          <p class="loading-state" id="list-state">Memuat...</p>
          <p class="form-hint" id="limit-note" hidden></p>
          <div class="table-wrap" id="table-wrap" hidden>
            <table class="table">
              <thead><tr><th scope="col">Tanggal</th><th scope="col">Kategori</th><th scope="col">Keterangan</th><th scope="col" class="text-right">Masuk</th><th scope="col" class="text-right">Keluar</th></tr></thead>
              <tbody id="cash-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="assets/js/cashflow.js"></script>
</body>
</html>
