<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengaturan — Inventory &amp; Cashflow Manager</title>
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke konten</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main">
      <header class="topbar">
        <button class="btn btn--secondary btn--sm menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false">Menu</button>
        <strong id="business-name"></strong>
      </header>
      <main class="content" id="main">
        <header class="page-header"><h1>Pengaturan</h1></header>
        <div id="page-message" class="alert" hidden></div>
        <section class="card" aria-labelledby="profile-title">
          <h2 class="card__title" id="profile-title">Profil saya</h2>
          <p class="text-muted">Email: <span id="account-email"></span> &middot; Peran: <span id="account-role"></span></p>
          <form id="profile-form">
            <div class="form-group"><label class="form-label" for="full_name">Nama lengkap</label><input class="form-input" id="full_name" name="full_name" type="text" autocomplete="name" required></div>
            <div class="form-group"><label class="form-label" for="phone">Telepon (opsional)</label><input class="form-input" id="phone" name="phone" type="tel" autocomplete="tel"></div>
            <div class="form-actions"><button class="btn btn--primary" id="profile-submit" type="submit">Simpan profil</button></div>
          </form>
        </section>
        <section class="card settings-business" aria-labelledby="business-title">
          <h2 class="card__title" id="business-title">Bisnis</h2>
          <form id="business-form">
            <div class="form-group"><label class="form-label" for="business_name">Nama bisnis</label><input class="form-input" id="business_name" name="business_name" type="text" required></div>
            <p class="form-hint" id="business-note" hidden>Hanya pemilik atau admin yang dapat mengubah nama bisnis.</p>
            <div class="form-actions"><button class="btn btn--primary" id="business-submit" type="submit">Simpan nama bisnis</button></div>
          </form>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="assets/js/settings.js"></script>
</body>
</html>
