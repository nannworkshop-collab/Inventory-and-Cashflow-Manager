<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Penjualan — Inventory &amp; Cashflow Manager</title>
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke konten</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main">
      <header class="topbar">
        <button class="btn btn--secondary btn--sm menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false">Menu</button>
        <strong id="business-name"></strong>
      </header>
      <main class="content" id="main">
        <header class="page-header"><h1>Penjualan</h1></header>
        <div id="page-message" class="alert" hidden></div>
        <section class="card" aria-labelledby="form-title">
          <h2 class="card__title" id="form-title">Penjualan baru</h2>
          <p class="empty-state" id="form-empty" hidden>Belum ada produk aktif yang stoknya tersedia. Atur produk di <a href="inventory.html">Inventori</a>.</p>
          <div id="form-wrap" hidden>
            <form id="tx-form">
              <div class="form-row">
                <div class="form-group"><label class="form-label" for="tx-date">Tanggal</label><input class="form-input" id="tx-date" name="tx_date" type="date" required></div>
                <div class="form-group"><label class="form-label" for="party">Pelanggan</label>
                  <div class="inline-field"><select class="form-select" id="party" name="party"></select><button class="btn btn--secondary" id="add-party" type="button">Baru</button></div>
                </div>
              </div>
              <div class="table-wrap">
                <table class="table items-table">
                  <thead><tr><th scope="col">Produk</th><th scope="col">Jumlah</th><th scope="col">Harga jual</th><th scope="col" class="text-right">Subtotal</th><th scope="col">Aksi</th></tr></thead>
                  <tbody id="items-body"></tbody>
                </table>
              </div>
              <p><button class="btn btn--secondary btn--sm" id="add-row" type="button">+ Tambah baris</button></p>
              <div class="form-group"><label class="form-label" for="tx-notes">Catatan (opsional)</label><input class="form-input" id="tx-notes" name="tx_notes" type="text"></div>
              <div class="total-bar"><span>Total</span><span id="tx-total">Rp 0</span></div>
              <div class="form-actions"><button class="btn btn--primary" id="tx-submit" type="submit">Simpan Penjualan</button></div>
            </form>
          </div>
        </section>
        <section class="card" aria-labelledby="history-title">
          <h2 class="card__title" id="history-title">Riwayat penjualan</h2>
          <p class="empty-state" id="history-state">Belum ada penjualan.</p>
          <div class="table-wrap" id="history-wrap" hidden>
            <table class="table">
              <thead><tr><th scope="col">No. faktur</th><th scope="col">Tanggal</th><th scope="col">Pelanggan</th><th scope="col" class="text-right">Total</th><th scope="col">Status</th><th scope="col">Aksi</th></tr></thead>
              <tbody id="history-body"></tbody>
            </table>
          </div>
        </section>

        <dialog class="dialog" id="party-dialog" aria-labelledby="party-dialog-title">
          <h2 id="party-dialog-title">Pelanggan baru</h2>
          <div id="party-message" class="alert" hidden></div>
          <form id="party-form">
            <div class="form-group"><label class="form-label" for="party-name">Nama</label><input class="form-input" id="party-name" name="name" type="text" required></div>
            <div class="form-group"><label class="form-label" for="party-phone">Telepon (opsional)</label><input class="form-input" id="party-phone" name="phone" type="tel"></div>
            <div class="dialog__actions">
              <button class="btn btn--secondary" type="button" data-close>Batal</button>
              <button class="btn btn--primary" type="submit">Simpan</button>
            </div>
          </form>
        </dialog>
      </main>
    </div>
  </div>
  <script type="module" src="assets/js/sales.js"></script>
</body>
</html>
