<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengeluaran — Inventory &amp; Cashflow Manager</title>
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke konten</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main">
      <header class="topbar">
        <button class="btn btn--secondary btn--sm menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false">Menu</button>
        <strong id="business-name"></strong>
      </header>
      <main class="content" id="main">
        <header class="page-header"><h1>Pengeluaran</h1></header>
        <div id="page-message" class="alert" hidden></div>
        <section class="card" aria-labelledby="form-title">
          <h2 class="card__title" id="form-title">Catat pengeluaran operasional</h2>
          <p class="form-hint">Pembelian stok dicatat di halaman Pembelian, bukan di sini.</p>
          <form id="expense-form">
            <div class="form-row">
              <div class="form-group"><label class="form-label" for="expense-date">Tanggal</label><input class="form-input" id="expense-date" name="expense_date" type="date" required></div>
              <div class="form-group"><label class="form-label" for="category">Kategori</label><input class="form-input" id="category" name="category" type="text" list="category-list" required><datalist id="category-list"><option value="Gaji"></option><option value="Sewa"></option><option value="Listrik dan air"></option><option value="Transportasi"></option><option value="Pemasaran"></option><option value="Perlengkapan"></option><option value="Lainnya"></option></datalist></div>
              <div class="form-group"><label class="form-label" for="amount">Jumlah (Rp)</label><input class="form-input" id="amount" name="amount" type="number" min="1" step="0.01" required></div>
            </div>
            <div class="form-group"><label class="form-label" for="description">Keterangan (opsional)</label><input class="form-input" id="description" name="description" type="text"></div>
            <div class="form-actions"><button class="btn btn--primary" id="expense-submit" type="submit">Simpan Pengeluaran</button></div>
          </form>
        </section>
        <section class="card" aria-labelledby="history-title">
          <h2 class="card__title" id="history-title">Riwayat pengeluaran</h2>
          <p class="empty-state" id="history-state">Belum ada pengeluaran.</p>
          <div class="table-wrap" id="history-wrap" hidden>
            <table class="table">
              <thead><tr><th scope="col">Tanggal</th><th scope="col">Kategori</th><th scope="col">Keterangan</th><th scope="col" class="text-right">Jumlah</th><th scope="col">Status</th><th scope="col">Aksi</th></tr></thead>
              <tbody id="history-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="assets/js/expenses.js"></script>
</body>
</html>
